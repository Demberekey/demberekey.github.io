<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci pour votre commande – Demberekey</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #F9F7F3; color: #264653; margin: 0; padding: 2rem; text-align: center; }
        h1 { color: #2A9D8F; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #Zone_Widget { margin: 2rem 0; min-height: 400px; }
        .btn { background: #E76F51; color: white; padding: 12px 30px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #F4A261; }
        .info { background: #f0f9f7; padding: 1rem; border-radius: 8px; margin: 1.5rem 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Merci pour votre commande !</h1>
        <p>Votre paiement a bien été reçu.</p>
        
        <div class="info">
            <strong>Dernière étape :</strong> Choisissez ci-dessous le Point Relais où vous souhaitez récupérer votre colis.
        </div>

        <!-- Widget Mondial Relay -->
        <div id="Zone_Widget"></div>
        <input type="hidden" id="Retour_Widget" name="point_relais">

        <br>
        <form id="form-relais" action="https://formspree.io/f/xkovbyra" method="POST">
            <input type="hidden" name="point_relais_id" id="point_relais_id">
            <input type="hidden" name="point_relais_info" id="point_relais_info">
            <input type="text" name="email" placeholder="Votre email (celui utilisé pour le paiement)" required style="padding:10px; width:80%; margin-bottom:10px;">
            <br>
            <button type="submit" class="btn">Valider mon Point Relais</button>
        </form>

        <p style="margin-top:2rem; font-size:0.9rem;">Vous recevrez un email de confirmation dès que le colis sera expédié.</p>
    </div>

    <!-- Scripts du widget -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://widget.mondialrelay.com/parcelshop-picker/jquery.plugin.mondialrelay.parcelshoppicker.min.js"></script>
    
    <script>
        $(document).ready(function () {
            $("#Zone_Widget").MR_ParcelShopPicker({
                Target: "#Retour_Widget",
                Brand: "CC23VQHV",          // Votre Code Enseigne Production
                Country: "FR",
                Responsive: true,
                OnParcelShopSelected: function (data) {
                    // Remplit automatiquement le formulaire
                    document.getElementById("point_relais_id").value = data.ID;
                    document.getElementById("point_relais_info").value = data.Nom + " - " + data.Adresse1 + " " + data.CP + " " + data.Ville;
                }
            });
        });
    </script>
</body>
</html>
